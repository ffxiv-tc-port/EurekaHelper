services:
  app:
    build: ./EurekaTrackerServer
    restart: unless-stopped
    volumes:
      - eureka-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  eureka-data:
  caddy-data:
  caddy-config:
